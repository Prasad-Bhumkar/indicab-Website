services:
  # Redis Cache & Session Store
  redis:
    env_file:
      - .env.production
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 5s
      retries: 5
      interval: 10s # Increased interval to reduce startup load
    networks:
      - indicab-network
    restart: unless-stopped

  # MySQL Database
  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password --skip-name-resolve=0 --bind-address=0.0.0.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-indicab_website}
      MYSQL_USER: ${DB_USERNAME:-indicab_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-indicab_password}
    ports:
      # Changed default to 3307 to avoid conflicts with local MySQL installs
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
      timeout: 20s
      retries: 10
      interval: 10s # Slightly relaxed to avoid slamming the CPU during init
      start_period: 60s
    networks:
      - indicab-network
    restart: unless-stopped

  # Backend Spring Boot Service
  backend:
    env_file:
      - .env.production
    build:
      context: ./indicab-backend
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-indicab_website}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DATABASE_USERNAME: ${DB_USERNAME:-indicab_user}
      DATABASE_PASSWORD: ${DB_PASSWORD:-indicab_password}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-900}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:5173,http://localhost:5174}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-your-default-encryption-key-change-in-production}
      # Flyway disabled - using Hibernate DDL auto for schema management
      SPRING_FLYWAY_ENABLED: "false"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8000/actuator/health"]
      timeout: 10s
      retries: 5
      interval: 20s
    networks:
      - indicab-network
    restart: unless-stopped

  # Frontend React/Vite Service
  frontend:
    env_file:
      - .env.production
    build:
      context: ./indicab-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - indicab-network
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  indicab-network:
    driver: bridge
