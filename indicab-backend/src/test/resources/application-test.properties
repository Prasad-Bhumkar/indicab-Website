# Test Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3307/indicab_website_test?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate Configuration for Tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration for Tests
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=true
spring.flyway.validate-on-migrate=false
spring.flyway.repair-on-migrate=true

# Server Configuration
server.port=8000

# JWT Configuration (Test dummy values)
jwt.secret=test-secret-key-for-testing-purposes-only-not-production
jwt.expiration=900

# Redis Configuration (disabled for tests)
redis.enabled=false
spring.redis.host=localhost
spring.redis.port=6379

# Logging Configuration
logging.level.root=INFO
logging.level.com.indicab=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
