# Test Database Configuration
spring.datasource.url=jdbc:h2:mem:indicab_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA and Hibernate Configuration for Tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration for Tests (disabled to avoid MySQL-specific migrations)
spring.flyway.enabled=false

# Server Configuration
server.port=8000

# CORS configuration for tests
cors.allowed-origins=http://localhost,http://127.0.0.1,http://localhost:5173,http://localhost:5174

# JWT Configuration (Test dummy values)
jwt.secret=test-secret-key-for-testing-purposes-only-not-production-1234567890
jwt.expiration=900
jwt.refresh.expiration=604800

encryption.key=test-encryption-key-for-tests-0123456789abcdef

# Redis Configuration (disabled for tests)
redis.enabled=false
spring.redis.host=localhost
spring.redis.port=6379

# Logging Configuration
logging.level.root=INFO
logging.level.com.indicab=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
