spring.application.name=indicab-backend
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/indicab_website}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_HIBERNATE_DDL:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
server.port=${SERVER_PORT:8000}

jwt.secret=${JWT_SECRET:your-super-secret-key-change-this-in-production}
jwt.expiration=${JWT_EXPIRATION:900}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION:604800}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api/v1/docs
springdoc.swagger-ui.path=/api/v1/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Payment Gateway Configuration
# Stripe (International)
stripe.api.key=${STRIPE_API_KEY:}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}

# Razorpay (India - Primary Gateway)
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
