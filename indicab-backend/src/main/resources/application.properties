spring.application.name=indicab-backend
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/indicab_website?createDatabaseIfNotExist=true}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate Configuration
# Use 'validate' in production with Flyway migrations, 'update' for development
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway Database Migration Configuration
# Disabled - using Hibernate DDL auto for schema management
spring.flyway.enabled=false

# Server Configuration
server.port=${SERVER_PORT:8000}
server.servlet.context-path=/
server.error.include-message=always
server.error.include-stacktrace=${ERROR_STACKTRACE:on_param}

# Connection Pool Configuration for VPS
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# JWT Secret MUST be provided via environment variable JWT_SECRET
# Never commit a secret key to version control. Use a secure secret manager (AWS Secrets Manager, Vault, etc.)
# Minimum length: 32 characters. Recommended: 64+ characters with high entropy.
# CRITICAL: This property MUST be set via environment variable. No default provided.
# If not set, application will fail to start with clear error message.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:900}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION:604800}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost,http://127.0.0.1,http://localhost:5173,http://localhost:5174}

# Redis Configuration (for caching and distributed rate limiting)
# NOTE: Set SPRING_REDIS_HOST via env var (defaults to redis for Docker Compose)
spring.redis.host=${SPRING_REDIS_HOST:redis}
spring.redis.port=${SPRING_REDIS_PORT:6379}
spring.redis.password=${SPRING_REDIS_PASSWORD:}
spring.redis.timeout=2000
spring.redis.jedis.pool.max-active=8
spring.redis.jedis.pool.max-idle=8
spring.redis.jedis.pool.min-idle=0
redis.enabled=${REDIS_ENABLED:true}

# Disable Redis health check so the app stays UP even if Redis is temporarily unreachable
management.health.redis.enabled=false

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api/v1/docs
springdoc.swagger-ui.path=/api/v1/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Spring Boot Actuator Configuration for VPS Health Checks
management.endpoints.web.exposure.include=${ACTUATOR_ENDPOINTS:health,metrics,info}
management.endpoint.health.show-details=when-authorized
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.endpoint.shutdown.enabled=false
management.metrics.export.simple.enabled=true
management.info.git.enabled=true
management.info.env.enabled=true

# Application Info for Actuator
info.app.name=IndiCab Backend
info.app.description=Ride booking and management system
info.app.version=1.0.0
info.company.name=IndiCab Solutions

# Logging Configuration for Production VPS (Hostinger)
# Helps debug issues in production environment
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=WARN
logging.level.com.indicab=INFO
logging.file.name=logs/indicab-backend.log
logging.file.max-size=10MB
logging.file.max-history=30
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# File Upload Configuration
# Handle profile pictures, documents, and other user uploads
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
spring.servlet.multipart.enabled=true

# Jackson Configuration for JSON Serialization
# Ensure dates are formatted consistently across API responses
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

# Encryption Configuration
# CRITICAL: encryption.key MUST be set via environment variable ENCRYPTION_KEY
# Never commit encryption keys to version control. Use a secure secret manager.
# Minimum length: 32 characters. Recommended: 64+ characters with high entropy.
encryption.key=${ENCRYPTION_KEY}

# Error Handling for Production
server.error.include-binding-errors=always
server.error.include-exception=false
